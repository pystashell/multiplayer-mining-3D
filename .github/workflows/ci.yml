name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and deployment dry run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # test:coverage runs the complete `npm test` exactly once, fails whenever
      # it fails, and adds a line-coverage report to the job summary.
      - name: Run the complete regression suite with a coverage report
        run: npm run test:coverage

      - name: Validate the Cloudflare bundle
        run: npm run deploy:dry
